<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Kingdom</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
background:linear-gradient(-45deg,#0f0c29,#302b63,#ff006e,#ff8800);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.header{text-align:center;font-size:40px;padding:15px;font-weight:bold}

.stats{display:flex;justify-content:center;gap:15px;margin:10px}

.stat{background:rgba(0,0,0,.4);padding:10px 15px;border-radius:10px}

.menu{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.menu button{padding:10px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

.section{display:none;padding:20px}
.active{display:block}

.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.case{background:rgba(255,255,255,.1);padding:15px;border-radius:12px;text-align:center}

.result{text-align:center;font-size:24px;margin:10px}

.inv-item{
display:flex;justify-content:space-between;
background:rgba(0,0,0,.3);
padding:8px;margin:5px;border-radius:8px;
}

.silver{color:silver}
.green{color:lime}
.blue{color:deepskyblue}
.epic{color:#c86bff}
.legendary{color:gold}
.ultra{color:red}

.donate{
position:fixed;
bottom:10px;
left:10px;
background:#ff0055;
padding:10px;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

</style>
</head>

<body>

<div class="header">🎁 CASE KINGDOM</div>

<div class="stats">
<div class="stat">⭐ <span id="stars">1000</span></div>
<div class="stat">💎 <span id="gems">20</span></div>
</div>

<div class="menu">
<button onclick="show('cases')">Кейсы</button>
<button onclick="show('inv')">Инвентарь</button>
</div>

<div id="cases" class="section active">

<div class="case-grid">

<div class="case">
<h3>Новичок</h3>
<button onclick="openCase(1)">100⭐</button>
</div>

<div class="case">
<h3>Стандарт</h3>
<button onclick="openCase(2)">750⭐</button>
</div>

<div class="case">
<h3>Дубай</h3>
<button onclick="openCase(3)">5000⭐</button>
</div>

<div class="case">
<h3>Лето</h3>
<button onclick="openCase(4)">10000⭐</button>
</div>

</div>

<div id="result" class="result"></div>

</div>

<div id="inv" class="section">
<h2 style="text-align:center">Инвентарь</h2>
<div id="inventory"></div>
</div>

<div class="donate" onclick="donate()">
💰 Донат
</div>

<script>

let stars=1000;
let gems=20;
let inv=[];

// ===== ПРЕДМЕТЫ =====
const items=[
{name:"Монета",r:"silver"},
{name:"Лист",r:"green"},
{name:"Раковина",r:"blue"},
{name:"Свиток",r:"epic"},
{name:"Корона",r:"ultra"},
{name:"Фламинго",r:"legendary"},
{name:"Арбуз",r:"ultra"}
];

// ===== НОРМ ШАНСЫ =====
function getItem(){
let r=Math.random()*100;

if(r<55) return rand("silver");
if(r<80) return rand("green");
if(r<92) return rand("blue");
if(r<97) return rand("epic");
if(r<99) return rand("legendary");
return rand("ultra");
}

function rand(type){
let pool=items.filter(i=>i.r===type);
return pool[Math.floor(Math.random()*pool.length)];
}

// ===== КЕЙС =====
function openCase(type){

let cost=[0,100,750,5000,10000][type];

if(stars<cost){
result.innerText="❌ нет звёзд";
return;
}

stars-=cost;

let res=document.getElementById("result");
res.innerText="🎁 открытие...";

let anim=setInterval(()=>{
res.innerText="🎲 "+getItem().name;
},80);

setTimeout(()=>{
clearInterval(anim);

let item=getItem();
inv.push(item);

res.innerHTML="🎉 "+item.name;

update();

},1500);

}

// ===== UI =====
function update(){

document.getElementById("stars").innerText=stars;
document.getElementById("gems").innerText=gems;

let box=document.getElementById("inventory");
box.innerHTML="";

inv.forEach((i,idx)=>{
box.innerHTML+=`
<div class="inv-item">
<span class="${i.r}">${i.name}</span>
</div>`;
});

}

function show(id){
document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

// ===== ДОНАТ =====
function donate(){

let code=prompt("код:");

if(code==="g778592612"){
stars+=100000;
gems+=500;
update();
alert("💰 выдано");
}else{
alert("❌ неверный код");
}

}

update();

</script>

</body>
</html>
