<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CarKnifes</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#ff0080);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

header{
    padding:30px;
    text-align:center;
}

header h1{
    font-size:60px;
    text-shadow:0 0 20px #ff00c8;
}

header p{
    margin-top:10px;
    font-size:22px;
    color:#ffd000;
}

.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-top:40px;
}

.btn{
    width:220px;
    padding:25px;
    border:none;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:0.3s;
    box-shadow:0 0 20px rgba(255,255,255,0.1);
}

.btn:hover{
    transform:scale(1.07);
    background:rgba(255,255,255,0.2);
}

.battlepass{
    width:90%;
    margin:60px auto;
    background:rgba(255,255,255,0.08);
    border-radius:30px;
    padding:40px;
    backdrop-filter:blur(15px);
}

.battlepass h2{
    font-size:45px;
    margin-bottom:20px;
}

.reward{
    background:rgba(0,0,0,0.3);
    padding:20px;
    border-radius:20px;
    margin-top:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.reward button{
    background:gold;
    border:none;
    padding:12px 25px;
    border-radius:15px;
    font-weight:bold;
    cursor:pointer;
}

.craft{
    width:90%;
    margin:50px auto;
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:50px;
    border-radius:30px;
    backdrop-filter:blur(15px);
}

.craft h2{
    font-size:45px;
}

.craft p{
    margin-top:15px;
    font-size:22px;
}

.craft button{
    margin-top:30px;
    padding:18px 50px;
    border:none;
    border-radius:20px;
    background:linear-gradient(45deg,#ffcc00,#ff0080);
    color:black;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.craft button:hover{
    transform:scale(1.08);
}
</style>
</head>

<body>

<header>
    <h1>CarKnifes</h1>
    <p>☀ Summer Season</p>
</header>

<div class="menu">
    <button class="btn">🎁 Кейсы</button>
    <button class="btn">🚗 Инвентарь</button>
    <button class="btn">🔧 Крафт</button>
    <button class="btn">🏆 Battle Pass</button>
    <button class="btn" onclick="window.open('https://t.me/KosmosHardoxxx')">📞 Поддержка</button>
</div>

<div class="battlepass">

<h2>☀ Summer Battle Pass</h2>

<div class="reward">
    <div>
        <h3>LVL 1 — 10k Coins</h3>
        <p>Free Reward</p>
    </div>

    <button>CLAIM</button>
</div>

<div class="reward">
    <div>
        <h3>LVL 5 — Summer Tokens</h3>
        <p>Premium Reward</p>
    </div>

    <button>CLAIM</button>
</div>

<div class="reward">
    <div>
        <h3>LVL 10 — Nissan GTR Miami Edition</h3>
        <p>Premium Reward</p>
    </div>

    <button>CLAIM</button>
</div>

<div class="reward">
    <div>
        <h3>LVL 15 — Brabus 6x6 Summer</h3>
        <p>ULTRA RARE</p>
    </div>

    <button>CLAIM</button>
</div>

</div>

<div class="craft">

<h2>🌴 Rolls-Royce Cullinan</h2>

<p>Summer Edition</p>

<p>🔧 Нужно: 5 Legendary Cars</p>

<p>🎲 Шанс: 15%</p>

<button onclick="craftCar()">
CRAFT NOW
</button>

</div>

<script>
function craftCar(){

    let chance = Math.random()*100;

    if(chance <= 15){

        alert('🔥 SUCCESS! Ты получил Rolls-Royce Cullinan Summer Edition');

    }else{

        alert('❌ FAILED! Машины уничтожены');

    }

}
</script>

</body>
</html>
