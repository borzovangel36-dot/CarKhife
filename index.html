<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-симулятор движения по GPS</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        /* Игровая карта (сетка) */
        .map-container {
            position: relative;
            width: 300px;
            height: 300px;
            background-color: #e5e5e5;
            border: 2px solid #ccc;
            border-radius: 8px;
            margin: 20px auto;
            background-image: 
                linear-gradient(rgba(0,0,0,0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 30px 30px;
        }

        /* Метка GPS (Цель) - Синяя */
        .gps-target {
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: #007bff;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(0,123,255,0.6);
            transition: all 0.3s ease;
        }

        /* Метка Игрока - Красная */
        .player {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: #dc3545;
            border: 2px solid white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px rgba(220,53,69,0.6);
            transition: all 0.3s ease;
        }

        /* Стрелка направления внутри маркера игрока */
        .player::after {
            content: '';
            position: absolute;
            top: -2px;
            left: 7px;
            width: 0;
            height: 0;
            border-left: 3px solid transparent;
            border-right: 3px solid transparent;
            border-bottom: 6px solid white;
            transition: transform 0.2s ease;
        }

        /* Панель кнопок */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        button {
            padding: 12px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-move {
            background-color: #28a745;
            color: white;
            grid-column: span 3;
        }

        .btn-move:hover { background-color: #218838; }

        .btn-turn {
            background-color: #6c757d;
            color: white;
        }

        .btn-turn:hover { background-color: #5a6268; }

        .status {
            margin-top: 15px;
            font-size: 15px;
            color: #333;
            min-height: 40px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Навигатор маршрута</h2>
    <div class="status" id="info-panel">Задайте маршрут кнопками ниже</div>

    <div class="map-container">
        <div class="gps-target" id="target"></div>
        <div class="player" id="player"></div>
    </div>

    <div class="controls">
        <button class="btn-move" onclick="moveForward()">Ехать вперед ↑</button>
        <button class="btn-turn" onclick="turnLeft()">Повернуть ↰</button>
        <div style="visibility: hidden;"></div> <!-- Пустой блок для выравнивания сетки -->
        <button class="btn-turn" onclick="turnRight()">Повернуть ↱</button>
    </div>
</div>

<script>
    // Размеры карты в условных шагах (от 0 до 10)
    const gridSize = 10;
    const stepPixels = 30; // Сколько пикселей в одном шаге

    // Координаты игрока
    let playerX = 2;
    let playerY = 2;
    
    // Направление игрока: 0 = Север (вверх), 1 = Восток (вправо), 2 = Юг (вниз), 3 = Запад (влево)
    let direction = 0; 

    // Координаты синей GPS метки (цели)
    let targetX = 8;
    let targetY = 7;

    const directionsText = ["Север ↑", "Восток →", "Юг ↓", "Запад ←"];

    // Обновление позиций элементов на экране
    function updateMap() {
        const playerEl = document.getElementById('player');
        const targetEl = document.getElementById('target');
        const infoPanel = document.getElementById('info-panel');

        // Переводим координаты в пиксели от левого верхнего угла
        playerEl.style.left = (playerX * stepPixels) + 'px';
        playerEl.style.top = ((gridSize - playerY) * stepPixels) + 'px'; // Инвертируем Y, чтобы верх был увеличением

        // Визуально поворачиваем стрелочку игрока в зависимости от направления
        // 0 = 0deg, 1 = 90deg, 2 = 180deg, 3 = 270deg
        playerEl.style.transform = `translate(-50%, -50%) rotate(${direction * 90}deg)`;

        targetEl.style.left = (targetX * stepPixels) + 'px';
        targetEl.style.top = ((gridSize - targetY) * stepPixels) + 'px';

        // Проверка на прибытие
        if (playerX === targetX && playerY === targetY) {
            infoPanel.innerHTML = `<strong>🎉 Вы прибыли в пункт назначения!</strong>`;
        } else {
            // Считаем примерное расстояние (Манхэттенское расстояние для простоты)
            let distance = Math.abs(targetX - playerX) + Math.abs(targetY - playerY);
            infoPanel.innerHTML = `Направление: <strong>${directionsText[direction]}</strong><br>Осталось до GPS-метки: <strong>${distance} км</strong>`;
        }
    }

    // Поворот налево (против часовой стрелки)
    function turnLeft() {
        direction = (direction + 3) % 4;
        updateMap();
    }

    // Поворот направо (по часовой стрелке)
    function turnRight() {
        direction = (direction + 1) % 4;
        updateMap();
    }

    // Движение вперед по направлению взгляда
    function moveForward() {
        if (direction === 0 && playerY < gridSize) playerY++;      // Север
        else if (direction === 1 && playerX < gridSize) playerX++; // Восток
        else if (direction === 2 && playerY > 0) playerY--;        // Юг
        else if (direction === 3 && playerX > 0) playerX--;        // Запад
        
        updateMap();
    }

    // Инициализация при старте страницы
    updateMap();
</script>

</body>
</html>
