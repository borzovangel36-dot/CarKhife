<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CASE KINGDOM</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
min-height:100vh;
color:white;
background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#ff006e);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow-x:hidden;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.header{
text-align:center;
font-size:40px;
padding-top:20px;
font-weight:bold;
}

.meme1,.meme2{
text-align:center;
margin-top:10px;
}

.stats{
display:flex;
justify-content:center;
gap:20px;
margin-top:20px;
flex-wrap:wrap;
}

.stat{
background:rgba(0,0,0,0.4);
padding:12px 20px;
border-radius:10px;
}

.menu{
display:flex;
justify-content:center;
gap:15px;
margin-top:25px;
flex-wrap:wrap;
}

.menu button{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
transition:0.2s;
}

.menu button:hover{
transform:scale(1.08);
}

.section{
display:none;
padding:20px;
}

.active{display:block}

.case-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
max-width:1000px;
margin:auto;
}

.case{
background:rgba(255,255,255,0.08);
padding:20px;
border-radius:15px;
text-align:center;
}

.case button{
margin-top:10px;
padding:10px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.result{
text-align:center;
font-size:28px;
margin-top:20px;
min-height:40px;
}

.inventory-item{
display:flex;
justify-content:space-between;
padding:10px;
background:rgba(0,0,0,0.3);
margin:10px;
border-radius:10px;
}

.silver{color:silver}
.green{color:lime}
.blue{color:deepskyblue}
.epic{color:#d06cff}
.legendary{color:gold}
.ultra{color:red}

</style>
</head>

<body>

<div class="header">🎁 CASE KINGDOM</div>

<div class="meme1">💸 Бека депает — и ты депай!</div>
<div class="meme2">🤑 Кто не депает с утра, у того в кармане дыра</div>

<div class="stats">
<div class="stat">⭐ <span id="stars">1000</span></div>
<div class="stat">💎 <span id="gems">20</span></div>
</div>

<div class="menu">
<button onclick="show('cases')">Кейсы</button>
<button onclick="show('inv')">Инвентарь</button>
<button onclick="show('craft')">Крафт</button>
<button onclick="show('sup')">Поддержка</button>
</div>

<div id="cases" class="section active">

<div class="case-grid">

<div class="case">
<h3>Новичок</h3>
<p>100 ⭐</p>
<button onclick="openCase('new')">Открыть</button>
</div>

<div class="case">
<h3>Стандарт</h3>
<p>750 ⭐</p>
<button onclick="openCase('std')">Открыть</button>
</div>

<div class="case">
<h3>Дубай</h3>
<p>5000 ⭐</p>
<button onclick="openCase('dub')">Открыть</button>
</div>

<div class="case">
<h3>Летний</h3>
<p>10000 ⭐</p>
<button onclick="openCase('sum')">Открыть</button>
</div>

</div>

<div id="result" class="result"></div>

</div>

<div id="inv" class="section">
<h2 style="text-align:center">Инвентарь</h2>
<div id="inventory"></div>
</div>

<div id="craft" class="section">
<h2 style="text-align:center">Крафт (скоро)</h2>
</div>

<div id="sup" class="section">
<h2 style="text-align:center">Поддержка</h2>
<p style="text-align:center">@KosmosHardoxxx</p>
</div>

<script>

let stars = 1000;
let gems = 20;
let inv = [];

function show(id){
document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

function update(){
document.getElementById("stars").innerText = stars;
document.getElementById("gems").innerText = gems;

let box = document.getElementById("inventory");
box.innerHTML = "";

inv.forEach((i,idx)=>{
box.innerHTML += `
<div class="inventory-item">
<span class="${i.rarity}">${i.name}</span>
</div>`;
});
}

// ===== ЦЕНЫ =====
const price = {
silver: 50,
green: 150,
blue: 500,
epic: 2500,
legendary: 15000,
ultra: 75000
};

// ===== ПРЕДМЕТЫ =====
const items = [

{ name:"Чеканная монета", rarity:"silver" },
{ name:"Железная подкова", rarity:"silver" },
{ name:"Стальное перо", rarity:"silver" },
{ name:"Серебряный колокольчик", rarity:"silver" },
{ name:"Оловянный солдатик", rarity:"silver" },

{ name:"Лист монстеры", rarity:"green" },
{ name:"Зелёное яблоко", rarity:"green" },
{ name:"Бамбук", rarity:"green" },
{ name:"Нефритовый тотем", rarity:"green" },

{ name:"Раковина моря", rarity:"blue" },
{ name:"Глобус", rarity:"blue" },
{ name:"Песочные часы", rarity:"blue" },

{ name:"Аметист", rarity:"epic" },
{ name:"Маска карнавала", rarity:"epic" },
{ name:"Древний свиток", rarity:"epic" },

{ name:"Золотой кубок", rarity:"legendary" },
{ name:"Лавровый венец", rarity:"legendary" },

{ name:"Сердце Дракона", rarity:"ultra" },
{ name:"Корона Империи", rarity:"ultra" },

// ===== ЛЕТНИЕ ЭКСКЛЮЗИВЫ =====
{ name:"Золотой Арбуз", rarity:"ultra", summer:true },
{ name:"Надувной фламинго", rarity:"legendary", summer:true },
{ name:"Очки для отдыха", rarity:"epic", summer:true }

];

// ===== ШАНСЫ =====
function getItem(type){

let r = Math.random()*100;
let pool = items;

if(type==="sum" && r > 95){
pool = items.filter(i=>i.summer);
}

if(r < 60) pool = items.filter(i=>i.rarity==="silver");
else if(r < 85) pool = items.filter(i=>i.rarity==="green");
else if(r < 95) pool = items.filter(i=>i.rarity==="blue");
else if(r < 98) pool = items.filter(i=>i.rarity==="epic");
else if(r < 99.5) pool = items.filter(i=>i.rarity==="legendary");
else pool = items.filter(i=>i.rarity==="ultra");

return pool[Math.floor(Math.random()*pool.length)];
}

// ===== КЕЙСЫ =====
function openCase(type){

let cost = 0;

if(type==="new") cost=100;
if(type==="std") cost=750;
if(type==="dub") cost=5000;
if(type==="sum") cost=10000;

if(stars < cost){
document.getElementById("result").innerText="❌ Не хватает звёзд";
return;
}

stars -= cost;

// CS:GO анимация
let res = document.getElementById("result");
res.innerText="🎁 Открытие...";

let fake = setInterval(()=>{
let t = getItem(type);
res.innerHTML = `🎲 ${t.name}`;
},80);

setTimeout(()=>{

clearInterval(fake);

let item = getItem(type);
inv.push(item);

res.innerHTML = `🎉 Выпало: <span class="${item.rarity}">${item.name}</span>`;

update();

if(item.rarity==="ultra"){
ultraEffect(item.name);
}

},1600);

}

// ===== УЛЬТРА ЭФФЕКТ =====
function ultraEffect(name){

let f = document.createElement("div");

f.style = `
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:red;
opacity:0.6;
z-index:9999;
`;

document.body.appendChild(f);

setTimeout(()=>{
f.remove();
alert("🔥 ULTRA DROP: " + name);
},700);

}

// ===== ОБНОВЛЕНИЕ =====
function update(){

document.getElementById("stars").innerText = stars;
document.getElementById("gems").innerText = gems;

let box = document.getElementById("inventory");
box.innerHTML="";

inv.forEach((i)=>{
box.innerHTML += `
<div class="inventory-item">
<span class="${i.rarity}">${i.name}</span>
</div>`;
});

}

// ===== ПРОДАЖА =====
function sell(index){

let item = inv[index];
stars += price[item.rarity];

inv.splice(index,1);
update();

}

// ===== ПЕРЕРИСОВКА ИНВЕНТАРЯ С КНОПКОЙ =====
function update(){

document.getElementById("stars").innerText = stars;
document.getElementById("gems").innerText = gems;

let box = document.getElementById("inventory");
box.innerHTML = "";

inv.forEach((i,idx)=>{

box.innerHTML += `
<div class="inventory-item">
<span class="${i.rarity}">${i.name}</span>
<button onclick="sell(${idx})">💰 ${price[i.rarity]}⭐</button>
</div>
`;

});

}

// ===== КРАФТ =====
function craft(){

let ultraCount = inv.filter(i=>i.rarity==="ultra").length;

if(stars < 100000 || gems < 200 || ultraCount < 5){
alert("❌ Не хватает ресурсов");
return;
}

// списание
stars -= 100000;
gems -= 200;

// удалить 5 ультра
let removed = 0;
inv = inv.filter(i=>{
if(i.rarity==="ultra" && removed < 5){
removed++;
return false;
}
return true;
});

alert("🔥 СОЗДАН: ЛЕТНИЙ ВОДЯНОЙ АВТОМАТИК!");
update();

}

// ===== СОХРАНЕНИЕ =====
function save(){
localStorage.setItem("stars",stars);
localStorage.setItem("gems",gems);
localStorage.setItem("inv",JSON.stringify(inv));
}

function load(){
let s = localStorage.getItem("stars");
let g = localStorage.getItem("gems");
let i = localStorage.getItem("inv");

if(s) stars = Number(s);
if(g) gems = Number(g);
if(i) inv = JSON.parse(i);
}

// автосейв
setInterval(save,3000);

// загрузка
load();
update();

// ===== ПЕРВЫЙ СТАРТ =====
update();
