<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Город: Акимат и Финансовая Статистика</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #2c3e50;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #34495e, #2c3e50);
        }

        .hidden { display: none !important; }

        /* Игровой интерфейс */
        .game-container { display: flex; background: #1e272e; padding: 15px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        canvas { border-radius: 8px; background: #27ae60; }
        .ui-panel { width: 320px; margin-left: 20px; display: flex; flex-direction: column; gap: 15px; }

        .stats-box, .controls-box, .log-box {
            background: #2d3436;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #485460;
        }

        .stats-box p { font-size: 1.1rem; margin: 6px 0; font-weight: 600; }
        #stat-money { color: #2ecc71; }
        #stat-slots { color: #f1c40f; }

        .controls-box { display: flex; flex-direction: column; gap: 10px; }
        .drive-buttons { display: flex; gap: 10px; }
        .btn-drive { background: #2ecc71; flex-grow: 2; color: white; font-weight: bold; border: none; padding: 12px; border-radius: 5px; cursor: pointer;}
        .btn-turn { background: #e67e22; flex-grow: 1; color: white; font-weight: bold; border: none; padding: 12px; border-radius: 5px; cursor: pointer;}
        .btn-drive:hover { background: #27ae60; }
        .btn-turn:hover:not(:disabled) { background: #d35400; }
        
        button:disabled { background: #7f8c8d; cursor: not-allowed; }

        #action-btn { background: #3498db; color: white; font-weight: bold; border: none; padding: 12px; border-radius: 5px; cursor: pointer; }
        #action-btn:hover:not(:disabled) { background: #2980b9; }
        #upgrade-btn { background: #9b59b6; color: white; font-weight: bold; border: none; padding: 8px; border-radius: 5px; cursor: pointer; margin-top: 5px;}

        .log-box { flex-grow: 1; display: flex; flex-direction: column; }
        #game-log { height: 130px; overflow-y: auto; font-size: 0.9rem; color: #dcdde1; display: flex; flex-direction: column; gap: 6px; }

        /* МОДАЛЬНОЕ ОКНО: ЛОББИ АКИМАТА */
        .akimat-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .akimat-menu {
            background: #2c3e50;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #34495e;
            text-align: center;
            min-width: 300px;
        }

        .akimat-btn {
            background: #e67e22; color: white; border: none;
            padding: 10px 20px; margin: 10px; font-size: 15px;
            border-radius: 5px; cursor: pointer; font-weight: bold;
        }
        .akimat-btn.secondary { background: #7f8c8d; }
        .akimat-btn:hover { opacity: 0.9; }

        /* ЭКРАН ИЗ BLACK RUSSIA: ДОХОД БИЗНЕСА */
        .br-stats-screen {
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #c0392b;
            padding: 20px;
            border-radius: 5px;
            width: 320px;
            font-family: monospace;
            text-align: left;
            box-shadow: inset 0 0 15px rgba(231, 76, 60, 0.2);
        }
        .br-header { color: #3498db; font-size: 18px; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .br-table-header { display: flex; justify-content: space-between; color: #bdc3c7; font-size: 14px; margin-bottom: 8px; }
        .br-list { max-height: 250px; overflow-y: auto; margin-bottom: 15px; }
        .br-row { display: flex; justify-content: space-between; color: #fff; font-size: 14px; padding: 3px 0; }
        .br-money { color: #f1c40f; }
        .br-collect-btn { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 3px; }
    </style>
</head>
<body>

    <!-- Игровой Экран -->
    <div id="game-screen" class="screen">
        <div class="game-container">
            
            <!-- Окна Акимата (всплывают прямо поверх игры) -->
            <div id="akimat-lobby" class="akimat-overlay hidden">
                <div class="akimat-menu">
                    <h2 style="color: #f1c40f; margin-top:0;">🏛 Акимат Города</h2>
                    <p>Добро пожаловать в администрацию управления доходами.</p>
                    <button class="akimat-btn" onclick="openBrStats()">Просмотреть прибыль</button>
                    <button class="akimat-btn secondary" onclick="closeAkimat()">Пропустить</button>
                </div>
            </div>

            <div id="akimat-br-stats" class="akimat-overlay hidden">
                <div class="br-stats-screen">
                    <div class="br-header">Доход бизнеса за 20 дней</div>
                    <div class="br-table-header">
                        <span>Дата</span>
                        <span>Прибыль</span>
                    </div>
                    <div class="br-list" id="br-data-list">
                        <!-- Сюда скрипт закинет сгенерированные дни -->
                    </div>
                    <div style="border-top: 1px solid #444; padding-top: 10px; margin-bottom: 10px; text-align: right;">
                        Итого накоплено: <span id="br-total-accumulated" style="color: #2ecc71; font-weight:bold;">0 руб</span>
                    </div>
                    <button class="br-collect-btn" onclick="collectAkimatMoney()">Снять деньги и выйти</button>
                </div>
            </div>

            <!-- Сама игра -->
            <canvas id="gameCanvas" width="700" height="700"></canvas>
            
            <div class="ui-panel">
                <div class="stats-box">
                    <h2 style="margin-top:0; color:#2ecc71;">📊 Статистика</h2>
                    <p>💰 Баланс: <span id="stat-money">1000 руб</span></p>
                    <p>🔑 Слоты бизнесов: <span id="stat-slots">0 / 2</span></p>
                    <p>⏱ До генерации: <span id="stat-timer" style="color:#e74c3c">30с</span></p>
                </div>

                <div class="controls-box">
                    <h3>🎮 Навигация и Руль</h3>
                    <div class="drive-buttons">
                        <button id="drive-btn" class="btn-drive">Ехать вперед ↑</button>
                        <button id="turn-btn" class="btn-turn" disabled>Повернуть ↱</button>
                    </div>
                    
                    <button id="action-btn" disabled>Действие</button>
                    <button id="upgrade-btn" class="hidden">Прокачать бизнес</button>
                </div>

                <div class="log-box">
                    <h3 style="margin-top:0;">📋 Журнал событий</h3>
                    <div id="game-log"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Глобальное состояние
        let player = { money: 1000, slots: 2, pos: 0 };
        let businesses = {};
        let gameLogs = [];
        let isMoving = false;

        // Финансовая система (Акимат)
        let profitHistory = []; // Массив объектов { day: X, amount: Y }
        let currentDayCounter = 1;
        let accumulatedAkimatMoney = 0; // Деньги, лежащие в кассе Акимата
        let secondsLeft = 30; // Таймер пассивного дохода

        // Архитектура карты дорог
        const MAP = [
            { name: "СТАРТ", type: "start", x: 60, y: 60, nextDefault: 1 },
            { name: "Парикмахерская", type: "biz", x: 220, y: 60, price: 150, maxIncome: 60, upPrice: 100, upMaxInc: 120, nextDefault: 2, id: 1 },
            { name: "Ларек (46)", type: "biz", x: 380, y: 60, price: 250, maxIncome: 100, upPrice: 150, upMaxInc: 200, nextDefault: 3, id: 2 },
            // Развилка GPS 1
            { name: "Развилка GPS", type: "gps", x: 600, y: 60, nextDefault: 4, nextTurn: 7, text: "Прямо: к Кафешкам. Поворот: Срез к Банку через Озеро." }, 
            { name: "Кафе «У Ксюши»", type: "biz", x: 600, y: 240, price: 500, maxIncome: 240, upPrice: 300, upMaxInc: 450, nextDefault: 5, id: 3 },
            { name: "Игровой Салон", type: "biz", x: 600, y: 440, price: 400, maxIncome: 180, upPrice: 250, upMaxInc: 350, nextDefault: 6, id: 4 },
            // Развилка GPS 2
            { name: "Перекресток", type: "gps", x: 600, y: 620, nextDefault: 11, nextTurn: 9, text: "Прямо: в Акимат. Поворот: На улицу к Автомойке." },
            
            // Внутреннее кольцо
            { name: "БАНК", type: "bank", x: 380, y: 260, nextDefault: 8 },
            { name: "Налоговая", type: "tax", x: 220, y: 260, nextDefault: 10 },
            
            // С нижнего шоссе дороги сходятся
            { name: "Автомойка 24/7", type: "biz", x: 380, y: 440, price: 600, maxIncome: 280, upPrice: 400, upMaxInc: 500, nextDefault: 10, id: 5 },
            { name: "Служба Такси", type: "biz", x: 60, y: 440, price: 800, maxIncome: 350, upPrice: 500, upMaxInc: 700, nextDefault: 0, id: 6 },
            { name: "АКИМАТ", type: "akimat", x: 60, y: 620, nextDefault: 10 }
        ];

        // Инициализация бизнесов
        MAP.forEach((tile, index) => {
            if(tile.type === 'biz') {
                businesses[index] = { level: 1, owner: null, deadline: 4, maxIncome: tile.maxIncome };
            }
        });

        function addLog(text) {
            const logBox = document.getElementById('game-log');
            gameLogs.push(text);
            logBox.innerHTML = gameLogs.slice(-6).map(log => `<div>${log}</div>`).join('');
            logBox.scrollTop = logBox.scrollHeight;
        }

        // Логика навигатора (Синий маркер)
        function getGPSTargetIndex() {
            let alertTax = Object.values(businesses).some(b => b.owner === 'player' && b.deadline <= 1);
            if (alertTax) return 7; // Ведем в Банк
            
            let ownedCount = Object.values(businesses).filter(b => b.owner === 'player').length;
            if (ownedCount >= player.slots && player.money >= 300) return 8; // В Налоговую

            // По умолчанию подсвечиваем Акимат, если там накопились деньги!
            if (accumulatedAkimatMoney > 0) return 11;

            return null;
        }

        function updateUI() {
            document.getElementById('stat-money').innerText = `${player.money} руб`;
            let ownedCount = Object.values(businesses).filter(b => b.owner === 'player').length;
            document.getElementById('stat-slots').innerText = `${ownedCount} / ${player.slots}`;

            document.getElementById('action-btn').disabled = true;
            document.getElementById('upgrade-btn').classList.add('hidden');
            
            let currentTile = MAP[player.pos];
            let bState = businesses[player.pos];

            if (currentTile.type === 'gps') {
                document.getElementById('turn-btn').disabled = false;
            } else {
                document.getElementById('turn-btn').disabled = true;
            }

            if (!isMoving) {
                if (currentTile.type === 'biz') {
                    document.getElementById('action-btn').disabled = false;
                    if (!bState.owner) {
                        document.getElementById('action-btn').innerText = `Купить бизнес (${currentTile.price} руб)`;
                    } else if (bState.owner === 'player') {
                        document.getElementById('action-btn').innerText = `Внести налог (${Math.floor(currentTile.price*0.1)} руб)`;
                        if(bState.level === 1) {
                            document.getElementById('upgrade-btn').classList.remove('hidden');
                            document.getElementById('upgrade-btn').innerText = `Улучшить до Ур.2 (${currentTile.upPrice} руб)`;
                        }
                    }
                } else if (currentTile.type === 'tax') {
                    document.getElementById('action-btn').disabled = false;
                    document.getElementById('action-btn').innerText = "Купить слот лицензии (300 руб)";
                } else if (currentTile.type === 'bank') {
                    document.getElementById('action-btn').disabled = false;
                    document.getElementById('action-btn').innerText = "Оплатить все налоги";
                }
            }
        }

        // Таймер генерации прибыли каждые 30 секунд
        setInterval(() => {
            secondsLeft--;
            if (secondsLeft <= 0) {
                secondsLeft = 30;
                generatePassiveIncome();
            }
            document.getElementById('stat-timer').innerText = secondsLeft + 'с';
        }, 1000);

        // Функция симуляции прибыли в стиле Black Russia
        function generatePassiveIncome() {
            // Считаем суммарный лимит макс. доходов игрока
            let totalMax = 0;
            Object.keys(businesses).forEach(idx => {
                let b = businesses[idx];
                if (b.owner === 'player') {
                    totalMax += b.maxIncome;
                }
            });

            if (totalMax === 0) return; // Если бизнесов нет, прибыль не идет

            // Твоя формула: минимум = макс / 4
            let minProfit = Math.floor(totalMax / 4);
            // Генерация случайного числа в диапазоне
            let generatedProfit = Math.floor(Math.random() * (totalMax - minProfit + 1)) + minProfit;

            accumulatedAkimatMoney += generatedProfit;

            // Форматируем дату в стиле "двухзначного числа" (01, 02 и т.д.)
            let dayString = currentDayCounter < 10 ? '0' + currentDayCounter : currentDayCounter;
            
            // Добавляем в начало истории
            profitHistory.unshift({ day: dayString, amount: generatedProfit });
            if (profitHistory.length > 20) profitHistory.pop(); // Храним только 20 дней

            currentDayCounter++;
            addLog(`📈 Финансы: Сгенерирован доход за день ${dayString}! Зайдите в Акимат.`);
            drawMap();
        }

        // Окна Акимата
        function checkAkimatArrival() {
            document.getElementById('akimat-lobby').classList.remove('hidden');
        }

        function closeAkimat() {
            document.getElementById('akimat-lobby').classList.add('hidden');
            document.getElementById('akimat-br-stats').classList.add('hidden');
        }

        function openBrStats() {
            document.getElementById('akimat-lobby').classList.add('hidden');
            document.getElementById('akimat-br-stats').classList.remove('hidden');

            // Отрендерить список
            const listContainer = document.getElementById('br-data-list');
            document.getElementById('br-total-accumulated').innerText = `${accumulatedAkimatMoney} руб`;

            if(profitHistory.length === 0) {
                listContainer.innerHTML = `<div style="color:#7f8c8d; text-align:center; padding: 20px;">Данные за последние дни отсутствуют</div>`;
                return;
            }

            listContainer.innerHTML = profitHistory.map(row => `
                <div class="br-row">
                    <span>${row.day}</span>
                    <span class="br-money">${row.amount} руб</span>
                </div>
            `).join('');
        }

        function collectAkimatMoney() {
            if (accumulatedAkimatMoney > 0) {
                player.money += accumulatedAkimatMoney;
                addLog(`💰 Вы забрали из кассы Акимата ${accumulatedAkimatMoney} руб!`);
                accumulatedAkimatMoney = 0;
            } else {
                addLog(`ℹ️ В Акимате пока нет накопленной прибыли.`);
            }
            closeAkimat();
            updateUI();
            drawMap();
        }

        // Отрисовка карты
        function drawMap() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Трава и Озеро
            ctx.fillStyle = '#2ecc71'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.arc(350, 350, 105, 0, 2 * Math.PI); ctx.fillStyle = '#f1c40f'; ctx.fill();
            ctx.beginPath(); ctx.arc(350, 350, 95, 0, 2 * Math.PI); ctx.fillStyle = '#3498db'; ctx.fill();

            // Дороги
            ctx.strokeStyle = '#7f8c8d'; ctx.lineWidth = 18;
            MAP.forEach(tile => {
                let nextTile = MAP[tile.nextDefault];
                ctx.beginPath(); ctx.moveTo(tile.x, tile.y); ctx.lineTo(nextTile.x, nextTile.y); ctx.stroke();
                if (tile.type === 'gps') {
                    let turnTile = MAP[tile.nextTurn];
                    ctx.beginPath(); ctx.moveTo(tile.x, tile.y); ctx.lineTo(turnTile.x, turnTile.y); ctx.stroke();
                }
            });

            // Синий GPS маркер цели
            let gpsTargetIndex = getGPSTargetIndex();
            if (gpsTargetIndex !== null) {
                let targetTile = MAP[gpsTargetIndex];
                ctx.beginPath(); ctx.arc(targetTile.x, targetTile.y, 32, 0, 2 * Math.PI);
                ctx.fillStyle = 'rgba(0, 123, 255, 0.35)'; ctx.fill();
                ctx.strokeStyle = '#007bff'; ctx.lineWidth = 2; ctx.stroke();
            }

            // Здания
            MAP.forEach((tile, index) => {
                ctx.lineWidth = 2; ctx.strokeStyle = '#2c3e50';
                
                if (tile.type === 'start') ctx.fillStyle = '#27ae60';
                else if (tile.type === 'bank') ctx.fillStyle = '#e67e22';
                else if (tile.type === 'tax') ctx.fillStyle = '#9b59b6';
                else if (tile.type === 'gps') ctx.fillStyle = '#f1c40f';
                else if (tile.type === 'akimat') ctx.fillStyle = '#c0392b';
                else {
                    let b = businesses[index];
                    ctx.fillStyle = (b.owner === 'player') ? '#2980b9' : '#ecf0f1';
                }

                ctx.fillRect(tile.x - 40, tile.y - 22, 80, 44);
                ctx.strokeRect(tile.x - 40, tile.y - 22, 80, 44);

                ctx.fillStyle = (ctx.fillStyle === '#ecf0f1' || tile.type === 'gps') ? '#000' : '#fff';
                ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
                
                let words = tile.name.split(' ');
                if (words.length > 1) {
                    ctx.fillText(words[0], tile.x, tile.y - 3);
                    ctx.fillText(words.slice(1).join(' '), tile.x, tile.y + 7);
                } else {
                    ctx.fillText(tile.name, tile.x, tile.y + 3);
                }

                if (tile.type === 'biz') {
                    let b = businesses[index];
                    ctx.font = '8px sans-serif';
                    if(b.owner === 'player') {
                        ctx.fillStyle = b.deadline <= 1 ? '#e74c3c' : '#fff';
                        ctx.fillText(`Ур.${b.level} (Срок:${b.deadline})`, tile.x, tile.y + 17);
                    } else {
                        ctx.fillStyle = '#7f8c8d';
                        ctx.fillText(`Макс: ${tile.maxIncome}р`, tile.x, tile.y + 17);
                    }
                }
            });

            // Игрок (Красный маркер)
            let pTile = MAP[player.pos];
            ctx.beginPath(); ctx.arc(pTile.x, pTile.y, 12, 0, 2 * Math.PI);
            ctx.fillStyle = '#dc3545'; ctx.fill();
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
        }

        // Кнопки ходов
        document.getElementById('drive-btn').addEventListener('click', () => { if (!isMoving) executeMove(false); });
        document.getElementById('turn-btn').addEventListener('click', () => { if (!isMoving) executeMove(true); });

        function executeMove(takeTurn) {
            isMoving = true;
            let currentTile = MAP[player.pos];
            let oldPos = player.pos;

            if (currentTile.type === 'gps' && takeTurn) {
                player.pos = currentTile.nextTurn;
                addLog(`↪️ Вы повернули на перекрестке.`);
            } else {
                player.pos = currentTile.nextDefault;
            }

            // Налоги тикают при пересечении СТАРТа
            if (player.pos === 0 && oldPos !== 0) {
                player.money += 150;
                addLog("💸 Пройден круг! Бонус за вождение: +150 руб");
                Object.keys(businesses).forEach(idx => {
                    let b = businesses[idx];
                    if (b.owner === 'player') {
                        if (b.deadline > 0) b.deadline--;
                        else {
                            addLog(`⚠️ Налоги просрочены! Изъят бизнес: "${MAP[idx].name}"!`);
                            b.owner = null; b.level = 1; b.deadline = 4; b.maxIncome = MAP[idx].maxIncome;
                        }
                    }
                });
            }

            drawMap();
            
            setTimeout(() => {
                isMoving = false;
                let landing = MAP[player.pos];
                addLog(`📍 Вы прибыли: ${landing.name}`);
                
                if (landing.type === 'akimat') {
                    checkAkimatArrival();
                }
                
                updateUI();
            }, 300);
        }

        // Покупка / Налоги
        document.getElementById('action-btn').addEventListener('click', () => {
            let tile = MAP[player.pos];
            let b = businesses[player.pos];

            if (tile.type === 'biz') {
                if (!b.owner) {
                    let ownedCount = Object.values(businesses).filter(b => b.owner === 'player').length;
                    if (ownedCount >= player.slots) {
                        addLog("❌ Нет свободных слотов лицензии! Купите в Налоговой."); return;
                    }
                    if (player.money >= tile.price) {
                        player.money -= tile.price; b.owner = 'player'; b.deadline = 4;
                        addLog(`🎉 Вы купили предприятие "${tile.name}"!`);
                    } else { addLog("❌ Не хватает денег."); }
                } else if (b.owner === 'player') {
                    let fee = Math.floor(tile.price * 0.1);
                    if (player.money >= fee) { player.money -= fee; b.deadline = 4; addLog(`💳 Налог оплачен.`); } 
                    else { addLog("❌ Нет денег на налог."); }
                }
            } 
            else if (tile.type === 'tax') {
                if (player.money >= 300) { player.money -= 300; player.slots++; addLog(`🔑 Слотов стало: ${player.slots}`); } 
                else { addLog("❌ Слот стоит 300 руб!"); }
            } 
            else if (tile.type === 'bank') {
                let totalFee = 0;
                Object.keys(businesses).forEach(idx => { if(businesses[idx].owner === 'player') totalFee += Math.floor(MAP[idx].price * 0.1); });
                if (player.money >= totalFee) {
                    player.money -= totalFee;
                    Object.keys(businesses).forEach(idx => { if(businesses[idx].owner === 'player') businesses[idx].deadline = 4; });
                    addLog(`🏦 Все налоги закрыты! Списано: ${totalFee} руб`);
                }
            }
            drawMap(); updateUI();
        });

        // Апгрейд
        document.getElementById('upgrade-btn').addEventListener('click', () => {
            let tile = MAP[player.pos]; let b = businesses[player.pos];
            if(b && b.owner === 'player' && b.level === 1) {
                if (player.money >= tile.upPrice) {
                    player.money -= tile.upPrice; b.level = 2; b.maxIncome = tile.upMaxInc;
                    addLog(`🚀 Модернизация! Макс. доход "${tile.name}" увеличен до ${tile.upMaxInc} руб!`);
                    drawMap(); updateUI();
                }
            }
        });

        // Стартовый рендер
