<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Kingdom</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
min-height:100vh;
color:white;
background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#ff006e);
background-size:400% 400%;
animation:bg 10s ease infinite;
}
@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.header{text-align:center;font-size:40px;padding:15px;font-weight:bold}
.m{text-align:center;margin:5px 0}

.stats{display:flex;justify-content:center;gap:15px;margin:15px;flex-wrap:wrap}
.stat{background:rgba(0,0,0,.4);padding:10px 15px;border-radius:10px}

.menu{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.menu button{padding:10px 15px;border:none;border-radius:10px;cursor:pointer;font-weight:bold}

.section{display:none;padding:20px}
.active{display:block}

.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px}
.case{background:rgba(255,255,255,.1);padding:15px;border-radius:12px;text-align:center}

.result{text-align:center;font-size:25px;margin:15px;min-height:40px}

.inventory-item{
display:flex;justify-content:space-between;
background:rgba(0,0,0,.3);
padding:8px;margin:8px;border-radius:8px
}

.silver{color:silver}
.green{color:lime}
.blue{color:deepskyblue}
.epic{color:#d46cff}
.legendary{color:gold}
.ultra{color:red}
</style>
</head>

<body>

<div class="header">🎁 CASE KINGDOM</div>

<div class="m">💸 Бека депает — и ты депай!</div>
<div class="m">🤑 Кто не депает с утра, у того в кармане дыра</div>

<div class="stats">
<div class="stat">⭐ <span id="stars">1000</span></div>
<div class="stat">💎 <span id="gems">20</span></div>
</div>

<div class="menu">
<button onclick="show('cases')">Кейсы</button>
<button onclick="show('inv')">Инвентарь</button>
<button onclick="show('craft')">Крафт</button>
</div>

<div id="cases" class="section active">

<div class="case-grid">

<div class="case">
<h3>Новичок</h3>
<p>100 ⭐</p>
<button onclick="openCase('new')">Открыть</button>
</div>

<div class="case">
<h3>Стандарт</h3>
<p>750 ⭐</p>
<button onclick="openCase('std')">Открыть</button>
</div>

<div class="case">
<h3>Дубай</h3>
<p>5000 ⭐</p>
<button onclick="openCase('dub')">Открыть</button>
</div>

<div class="case">
<h3>Летний</h3>
<p>10000 ⭐</p>
<button onclick="openCase('sum')">Открыть</button>
</div>

</div>

<div id="result" class="result"></div>

</div>

<div id="inv" class="section">
<h2 style="text-align:center">Инвентарь</h2>
<div id="inventory"></div>
</div>

<div id="craft" class="section">
<h2 style="text-align:center">Крафт</h2>
<button onclick="craft()">Создать летний автоматик</button>
</div>

<script>

let stars = 1000;
let gems = 20;
let inv = [];

const price = {
silver:50,
green:150,
blue:500,
epic:2500,
legendary:15000,
ultra:75000
};

const items = [
{name:"Монета",rarity:"silver"},
{name:"Подкова",rarity:"silver"},
{name:"Лист",rarity:"green"},
{name:"Яблоко",rarity:"green"},
{name:"Раковина",rarity:"blue"},
{name:"Песочные часы",rarity:"blue"},
{name:"Аметист",rarity:"epic"},
{name:"Свиток",rarity:"epic"},
{name:"Кубок",rarity:"legendary"},
{name:"Корона",rarity:"ultra"},

// лето
{name:"Золотой Арбуз",rarity:"ultra",summer:true},
{name:"Фламинго",rarity:"legendary",summer:true},
{name:"Очки",rarity:"epic",summer:true}
];

function show(id){
document.querySelectorAll('.section').forEach(e=>e.classList.remove('active'));
document.getElementById(id).classList.add('active');
}

function getItem(type){

let r=Math.random()*100;

let pool=items;

if(type==="sum" && r>95){
pool=items.filter(i=>i.summer);
}

if(r<60) pool=items.filter(i=>i.rarity==="silver");
else if(r<85) pool=items.filter(i=>i.rarity==="green");
else if(r<95) pool=items.filter(i=>i.rarity==="blue");
else if(r<98) pool=items.filter(i=>i.rarity==="epic");
else if(r<99.5) pool=items.filter(i=>i.rarity==="legendary");
else pool=items.filter(i=>i.rarity==="ultra");

return pool[Math.floor(Math.random()*pool.length)];
}

function openCase(type){

let cost=0;
if(type==="new")cost=100;
if(type==="std")cost=750;
if(type==="dub")cost=5000;
if(type==="sum")cost=10000;

if(stars<cost){
result.innerText="❌ нет звёзд";
return;
}

stars-=cost;

let res=document.getElementById("result");
res.innerText="🎁 открытие...";

let fake=setInterval(()=>{
res.innerText="🎲 "+getItem(type).name;
},80);

setTimeout(()=>{
clearInterval(fake);

let item=getItem(type);
inv.push(item);

res.innerHTML="🎉 "+item.name;

update();

},1500);
}

function update(){

document.getElementById("stars").innerText=stars;
document.getElementById("gems").innerText=gems;

let box=document.getElementById("inventory");
box.innerHTML="";

inv.forEach((i,idx)=>{
box.innerHTML+=`
<div class="inventory-item">
<span class="${i.rarity}">${i.name}</span>
<button onclick="sell(${idx})">💰</button>
</div>`;
});

}

function sell(i){
stars+=price[inv[i].rarity];
inv.splice(i,1);
update();
}

function craft(){

let u=inv.filter(i=>i.rarity==="ultra").length;

if(stars<100000||gems<200||u<5){
alert("не хватает ресурсов");
return;
}

stars-=100000;
gems-=200;

let c=0;
inv=inv.filter(i=>{
if(i.rarity==="ultra"&&c<5){c++;return false;}
return true;
});

alert("🔥 создан автоматик!");
update();
}

update();

</script>

</body>
</html>
