<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Case Kingdom</title>

<style>
body{
margin:0;
font-family:Arial;
color:white;
background:linear-gradient(-45deg,#0f0c29,#302b63,#ff006e,#ff8800);
background-size:400% 400%;
animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.header{text-align:center;font-size:40px;padding:15px;font-weight:bold}

.stats{display:flex;justify-content:center;gap:10px;margin:10px}

.stat{background:rgba(0,0,0,.4);padding:10px 15px;border-radius:10px}

.menu{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.menu button{padding:10px;border:none;border-radius:10px;font-weight:bold;cursor:pointer}

.section{display:none;padding:20px}
.active{display:block}

.case-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.case{background:rgba(255,255,255,.1);padding:15px;border-radius:12px;text-align:center}

.result{text-align:center;font-size:24px;margin:10px;min-height:30px}

.inv-item{
display:flex;
justify-content:space-between;
background:rgba(0,0,0,.3);
padding:8px;margin:5px;border-radius:8px;
}

button{cursor:pointer}

.silver{color:silver}
.green{color:lime}
.blue{color:deepskyblue}
.epic{color:#c86bff}
.legendary{color:gold}
.ultra{color:red}

.donate{
position:fixed;
bottom:10px;
left:10px;
background:#ff0055;
padding:10px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

</style>
</head>

<body>

<div class="header">🎁 CASE KINGDOM</div>

<div class="stats">
<div>⭐ <span id="stars">1000</span></div>
<div>💎 <span id="gems">20</span></div>
</div>

<div class="menu">
<button onclick="show('cases')">🎁 Кейсы</button>
<button onclick="show('inv')">🎒 Инвентарь</button>
<button onclick="show('craft')">🔧 Крафт 🔫</button>
<button onclick="show('support')">📞 Техподдержка</button>
</div>

<!-- КЕЙСЫ -->
<div id="cases" class="section active">

<div class="case-grid">

<div class="case">
<h3>🎁 Новичок</h3>
<button onclick="openCase(1)">149⭐</button>
</div>

<div class="case">
<h3>📦 Стандарт</h3>
<button onclick="openCase(2)">519⭐</button>
</div>

<div class="case">
<h3>🏙 Дубай</h3>
<button onclick="openCase(3)">999⭐</button>
</div>

<div class="case">
<h3>🌴 Летний</h3>
<button onclick="openCase(4)">699⭐</button>
</div>

</div>

<div id="result" class="result"></div>

</div>

<!-- ИНВЕНТАРЬ -->
<div id="inv" class="section">
<h2 style="text-align:center">🎒 Инвентарь</h2>
<div id="inventory"></div>
</div>

<!-- КРАФТ -->
<div id="craft" class="section">
<h2 style="text-align:center">🔧 Крафт 🔫</h2>
<p style="text-align:center">🌊 Летний водяной автоматик</p>
</div>

<!-- ПОДДЕРЖКА -->
<div id="support" class="section">
<h2 style="text-align:center">📞 Техподдержка</h2>
<p style="text-align:center">@KosmosHardoxxx</p>
</div>

<!-- ДОНАТ -->
<div class="donate" onclick="donate()">💰 Донат</div>

<script>

let stars=1000;
let gems=20;
let inv=[];

const price={
silver:50,
green:150,
blue:500,
epic:2500,
legendary:15000,
ultra:75000
};

const items=[
{name:"🪙 Монета",r:"silver"},
{name:"🍀 Лист",r:"green"},
{name:"🐚 Раковина",r:"blue"},
{name:"📜 Свиток",r:"epic"},
{name:"👑 Корона",r:"ultra"},
{name:"🦩 Фламинго",r:"legendary"},
{name:"🍉 Арбуз",r:"ultra"}
];

// ===== РАВНОВЕСИЕ КЕЙСОВ =====
function getItem(type){

let r=Math.random()*100;

// НОВИЧОК (до синего)
if(type===1){
if(r<65) return rand("silver");
if(r<90) return rand("green");
return rand("blue");
}

// СТАНДАРТ (зелёный → легендарный)
if(type===2){
if(r<60) return rand("green");
if(r<85) return rand("blue");
if(r<97) return rand("epic");
return rand("legendary");
}

// ДУБАЙ (синий и выше)
if(type===3){
if(r<55) return rand("blue");
if(r<85) return rand("epic");
if(r<97) return rand("legendary");
return rand("ultra");
}

// ЛЕТНИЙ
if(type===4){
if(r<50) return rand("green");
if(r<80) return rand("blue");
if(r<93) return rand("epic");
if(r<99) return rand("legendary");
return rand("ultra");
}

}

function rand(type){
let pool=items.filter(i=>i.r===type);
return pool[Math.floor(Math.random()*pool.length)];
}

// ===== КЕЙС =====
function openCase(type){

let cost=[0,149,519,999,699][type];

if(stars<cost){
result.innerText="❌ нет звёзд";
return;
}

stars-=cost;

let res=document.getElementById("result");
res.innerText="🎁 открытие...";

let anim=setInterval(()=>{
res.innerText="🎲 "+getItem(type).name;
},80);

setTimeout(()=>{
clearInterval(anim);

let item=getItem(type);
inv.push(item);

res.innerHTML="🎉 "+item.name;

update();

},1500);

}

// ===== ПРОДАЖА =====
function sell(i){
stars+=price[inv[i].r];
inv.splice(i,1);
update();
}

// ===== КРАФТ =====
function craft(){

let u=inv.filter(i=>i.r==="ultra").length;

if(stars<100000||gems<200||u<5){
alert("❌ не хватает ресурсов");
return;
}

stars-=100000;
gems-=200;

let c=0;
inv=inv.filter(i=>{
if(i.r==="ultra"&&c<5){
c++;
return false;
}
return true;
});

alert("🔫 создан ВОДЯНОЙ АВТОМАТИК 🌊");
update();
}

// ===== ДОНАТ =====
function donate(){

let code=prompt("Введите код:");

if(code!=="g778592612"){
alert("❌ неверно");
return;
}

let s=Number(prompt("⭐ сколько выдать?"));
let g=Number(prompt("💎 сколько выдать?"));

if(isNaN(s)||isNaN(g)) return;

stars+=s;
gems+=g;

update();
alert("💰 начислено");
}

// ===== UI =====
function update(){

document.getElementById("stars").innerText=stars;
document.getElementById("gems").innerText=gems;

let box=document.getElementById("inventory");
box.innerHTML="";

inv.forEach((i,idx)=>{
box.innerHTML+=`
<div class="inv-item">
<span class="${i.r}">${i.name}</span>
<button onclick="sell(${idx})">💰 ${price[i.r]}⭐</button>
</div>`;
});

}

function show(id){
document.querySelectorAll(".section").forEach(e=>e.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

update();

</script>

</body>
</html>
