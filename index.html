<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CarKnifes</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:white;

    background:linear-gradient(-45deg,#0f0c29,#302b63,#24243e,#ff0080);
    background-size:400% 400%;
    animation:bg 12s ease infinite;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

header{
    text-align:center;
    padding-top:40px;
}

header h1{
    font-size:70px;
    text-shadow:0 0 25px #ff00c8;
}

header p{
    margin-top:10px;
    font-size:28px;
    color:#ffd000;
}

.menu{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:25px;
    margin-top:70px;
}

.btn{
    width:240px;
    padding:28px;
    border:none;
    border-radius:30px;

    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);

    color:white;
    font-size:24px;
    cursor:pointer;

    transition:0.3s;

    box-shadow:
    0 0 25px rgba(255,255,255,0.1);
}

.btn:hover{
    transform:scale(1.08);
    background:rgba(255,255,255,0.2);
}

.case-screen{
    display:none;

    width:100%;
    height:100vh;

    position:fixed;
    top:0;
    left:0;

    background:rgba(0,0,0,0.92);

    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:1000;
}

.case-box{
    width:260px;
    height:260px;

    border-radius:40px;

    background:linear-gradient(45deg,#ffd000,#ff0080);

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:40px;
    font-weight:bold;

    box-shadow:
    0 0 60px #ff00c8;

    cursor:pointer;

    transition:0.3s;
}

.case-box:hover{
    transform:scale(1.05);
}

.open-animation{
    animation:shake 0.5s infinite;
}

@keyframes shake{
    0%{transform:rotate(-3deg);}
    50%{transform:rotate(3deg);}
    100%{transform:rotate(-3deg);}
}

.reward{
    margin-top:50px;
    text-align:center;

    display:none;
}

.reward img{
    width:420px;
    filter:drop-shadow(0 0 25px gold);
}

.reward h2{
    margin-top:20px;
    font-size:45px;
}

.reward p{
    margin-top:10px;
    color:gold;
    font-size:26px;
}

.close-btn{
    margin-top:30px;

    padding:18px 45px;

    border:none;
    border-radius:20px;

    background:white;

    color:black;
    font-size:22px;

    cursor:pointer;
}

.inventory{
    position:fixed;

    top:20px;
    right:20px;

    background:rgba(255,255,255,0.1);

    padding:18px;

    border-radius:20px;

    backdrop-filter:blur(10px);
}

</style>
</head>

<body>

<div class="inventory">
    🚗 Машин: <span id="count">0</span>
</div>

<header>
    <h1>CarKnifes</h1>
    <p>☀ Summer Season</p>
</header>

<div class="menu">

<button class="btn" onclick="openCaseMenu()">
🎁 Кейсы
</button>

<button class="btn">
🚗 Инвентарь
</button>

<button class="btn">
🔧 Крафт
</button>

<button class="btn"
onclick="window.open('https://t.me/KosmosHardoxxx')">
📞 Поддержка
</button>

</div>

<div class="case-screen" id="caseScreen">

<div class="case-box" id="caseBox"
onclick="openCase()">

SUMMER
CASE

</div>

<div class="reward" id="reward">

<img id="carImage"
src="https://pngimg.com/d/rolls_royce_PNG40.png">

<h2 id="carName">
Rolls-Royce Cullinan
</h2>

<p id="rarity">
LEGENDARY
</p>

<button class="close-btn"
onclick="closeCase()">

ЗАКРЫТЬ

</button>

</div>

</div>

<script>

let inventory = 0;

const cars = [

{
    name:"BMW M4",
    rarity:"RARE",
    image:"https://pngimg.com/d/bmw_PNG1718.png"
},

{
    name:"Nissan GTR",
    rarity:"EPIC",
    image:"https://pngimg.com/d/nissan_PNG53.png"
},

{
    name:"Porsche 911",
    rarity:"LEGENDARY",
    image:"https://pngimg.com/d/porsche_PNG10650.png"
},

{
    name:"Rolls-Royce Cullinan",
    rarity:"MYTHIC",
    image:"https://pngimg.com/d/rolls_royce_PNG40.png"
}

];

function openCaseMenu(){

    document.getElementById('caseScreen')
    .style.display = 'flex';

}

function closeCase(){

    document.getElementById('caseScreen')
    .style.display = 'none';

    document.getElementById('reward')
    .style.display = 'none';

    document.getElementById('caseBox')
    .style.display = 'flex';

}

function openCase(){

    let box =
    document.getElementById('caseBox');

    box.classList.add('open-animation');

    setTimeout(()=>{

        box.classList.remove('open-animation');

        box.style.display='none';

        let random =
        cars[Math.floor(Math.random()*cars.length)];

        document.getElementById('carImage')
        .src = random.image;

        document.getElementById('carName')
        .innerText = random.name;

        document.getElementById('rarity')
        .innerText = random.rarity;

        document.getElementById('reward')
        .style.display = 'block';

        inventory++;

        document.getElementById('count')
        .innerText = inventory;

    },2500);

}

</script>

</body>
</html>
